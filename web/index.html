<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>json-to-types — JSON to TypeScript</title>
    <meta
      name="description"
      content="Paste a JSON sample and get clean TypeScript types. Nested objects become named interfaces. Nothing leaves your browser."
    />
    <meta name="theme-color" content="#12100e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312100e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='15' fill='%23f0a04b'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">{ }</span>
          <div>
            <h1>json-to-types</h1>
            <p>JSON samples, named TypeScript types.</p>
          </div>
        </div>
        <div class="controls">
          <fieldset class="segmented">
            <legend class="sr-only">Declaration style</legend>
            <label>
              <input type="radio" name="format" value="interface" checked />
              <span>interface</span>
            </label>
            <label>
              <input type="radio" name="format" value="type" />
              <span>type</span>
            </label>
          </fieldset>
          <label class="name-field">
            <span>Name</span>
            <input id="root-name" value="Root" spellcheck="false" autocomplete="off" maxlength="80" />
          </label>
          <label class="check">
            <input id="exported" type="checkbox" checked />
            <span>export</span>
          </label>
          <a class="github" href="https://github.com/frozenmango8/json-to-types">
            <svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
            GitHub
          </a>
        </div>
      </header>

      <main class="panes">
        <section class="pane" aria-labelledby="json-label">
          <div class="pane-bar">
            <h2 id="json-label">JSON</h2>
            <label class="example-field">
              <span class="sr-only">Examples</span>
              <select id="example"></select>
            </label>
          </div>
          <div class="editor">
            <textarea
              id="json"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              aria-label="JSON sample"
              aria-describedby="status"
              placeholder="Paste a JSON sample…"
            ></textarea>
          </div>
        </section>
        <section class="pane" aria-labelledby="types-label">
          <div class="pane-bar">
            <h2 id="types-label">TypeScript</h2>
            <div class="pane-actions">
              <button type="button" id="download" disabled>Download</button>
              <button type="button" id="copy" class="primary" disabled>Copy</button>
            </div>
          </div>
          <div class="editor">
            <textarea
              id="types"
              readonly
              spellcheck="false"
              aria-label="Generated TypeScript"
              aria-describedby="status"
              placeholder="Types will show up here."
            ></textarea>
          </div>
        </section>
      </main>

      <footer class="bottom">
        <p id="status" role="status">Nested objects become named types. Fields missing from a sample are optional.</p>
        <p class="privacy">Nothing leaves your browser.</p>
      </footer>
    </div>
    <noscript>
      <p class="noscript">JavaScript is required to convert JSON in this page.</p>
    </noscript>
    <script src="./json-to-types.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
